# dsh-rewind bundle patch: one row, dual-face (node half = the package's
# default export, browser half = ./client via the `dsh.client` declaration).
# The row name MUST equal the package name — the client-modules node half
# resolves `require.resolve('<row-name>/package.json')` to find the package.
# `@qyy2005/dsh-rewind` is this fork's scoped package name, so the plain
# `dsh-rewind-plugin` row id is kept as-is: the row id (the settings/config entry
# id) is independent of the name, and keeping it preserves the profile entry the
# settings card and the client's style marker are keyed by.
- insert:
    - id: dsh-rewind-plugin
      name: '@qyy2005/dsh-rewind'
